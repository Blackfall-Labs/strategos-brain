[package]
name = "strategos-probe"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Activation prober for neuronal distillation — characterizes functional fingerprints of model layers."

[dependencies]
strategos-ops = { path = "../ops" }
strategos-runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"

[[bin]]
name = "probe"
path = "src/main.rs"

[[bin]]
name = "extract"
path = "src/extract.rs"
