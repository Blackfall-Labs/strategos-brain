[package]
name = "strategos-runtime"
version = "0.1.0"
edition.workspace = true
description = "Strategos MoE runtime — model loading, forward pass, routing."

[dependencies]
strategos-ops = { path = "../ops" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

[[bin]]
name = "qwen3_test"
path = "src/bin/qwen3_test.rs"

[[bin]]
name = "smollm3_test"
path = "src/bin/smollm3_test.rs"

[[bin]]
name = "phi4_test"
path = "src/bin/phi4_test.rs"

[[bin]]
name = "strategos"
path = "src/bin/strategos_repl.rs"

[[bin]]
name = "export_weights"
path = "src/bin/export_weights.rs"
